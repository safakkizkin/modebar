name: Release

# Package locally with ./scripts/package.sh and `gh release create` so the
# Homebrew cask sha256 matches the uploaded zip. Use this workflow only when
# you intentionally want CI to build and attach artifacts.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish zip
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Package
        id: pkg
        run: |
          VERSION="${{ inputs.version }}"
          ./scripts/package.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "dist/ModeBar-${VERSION}.zip.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: |
            dist/ModeBar-*.zip
            dist/ModeBar-*.zip.sha256
          generate_release_notes: true
          body: |
            CI-built artifact. Update `Casks/modebar.rb` sha256 to:
            `${{ steps.pkg.outputs.sha256 }}`
