name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Ideal behaviour. Link protocol docs or bosectl/ANChor notes if relevant.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device(s) this would help
      placeholder: "QC Ultra, prince/0x4075, …"
